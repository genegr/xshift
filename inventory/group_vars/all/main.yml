---
# Shared, non-secret configuration for all plays.
# Secrets are referenced from vault.yml (encrypt it with ansible-vault).

# --- Global ---
# true = simulate (no changes). Override: -e "dry_run=false"
dry_run: true

# --- vCenter (stage 1) ---
vcenter_hostname: "myvcenter"
vcenter_username: "administrator@vsphere.local"
vcenter_password: "{{ vault_vcenter_password }}"
vcenter_datacenter: "DC01"

# Target VM for the single-VM stage-1 run
target_vm_name: "lin-server01"

# --- Pure FlashArray (stage 1) ---
fa_url: "10.0.0.101"
fa_api_token: "{{ vault_fa_api_token }}"
# FlashArray host/host-group object representing the ESXi host
pure_host_name: "esxi03"

# --- OpenStack / Cinder (stage 2) ---
# From: openstack volume service list  (Host + '#' + backend name)
cinder_pure_host: "openstack00@Pure-FlashArray-iscsi#pure_iscsi_backend"
cinder_pure_volume_type: "pure"
