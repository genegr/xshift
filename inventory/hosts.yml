---
# Inventory: hosts and groups only. Configuration lives in group_vars/all/.
all:
  children:
    # Ansible controller: talks to vCenter, Pure API, and OpenStack.
    controllers:
      hosts:
        localhost:
          ansible_connection: local
          # Interpreter is auto-detected inside the runner container; do not hardcode.

    # ESXi hypervisors: where vmkfstools runs over SSH (stage 1).
    # List every host a migrated VM may be placed on; stage 1 picks the one vCenter
    # reports for the VM by matching its inventory name, ansible_host or esxi_vcenter_name.
    hypervisors:
      hosts:
        esxi03:
          ansible_user: root
          ansible_password: "{{ vault_esxi_password }}"
          # esxi_vcenter_name: "esxi03.example.com"   # only if vCenter's name matches neither of the above
          # pure_host_name: "esxi03"                  # only to force a FlashArray host object (default: matched by initiators)
