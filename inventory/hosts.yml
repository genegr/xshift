---
# Inventory: hosts and groups only. Configuration lives in group_vars/all/.
all:
  children:
    # Ansible controller: talks to vCenter, Pure API, and OpenStack.
    controllers:
      hosts:
        localhost:
          ansible_connection: local
          # Interpreter is auto-detected inside the runner container; do not hardcode.

    # ESXi hypervisors: where vmkfstools runs over SSH (stage 1).
    hypervisors:
      hosts:
        esxi03:
          ansible_user: root
          ansible_password: "{{ vault_esxi_password }}"
