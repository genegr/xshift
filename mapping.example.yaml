---
# ============================================================================
# vSphere -> OpenStack migration mapping (stage 2 input)
# ============================================================================
# Copy to mapping.yaml and edit. One entry per VM to migrate.
#
# Stage 1 writes a starting point for each VM it processed to
# generated/mapping-<vm>.yaml (vCPU, RAM, firmware, NIC portgroups, disks).
# Review it, replace the portgroup names with Neutron networks, and merge it
# here or pass it directly:  -e mapping_file=generated/mapping-<vm>.yaml
#
# The Cinder backend (cinder_pure_host / cinder_pure_volume_type) is configured
# in inventory/group_vars/all/main.yml - this file only lists WHAT to migrate.
#
# PRECONDITION: stage 1 (migrate_vm.yaml) has cloned each VMDK onto a Pure
# volume named <vm>-disk-<key>, where <vm> is the VM name lowercased with every
# character other than a-z, 0-9 and '-' folded to '-', and <key> is the vCenter
# disk key (0, 1, ...). The volume is disconnected from ESXi.
# ============================================================================

vm_migrations:
  - name: "lin-server01"            # OpenStack instance name (usually the source VM name)

    # Reference an existing flavor by name...
    flavor: "m1.large"
    # ...or auto-create one from these:
    # flavor_auto: true
    # vcpus: 2
    # ram_mb: 4096

    availability_zone: "nova"
    key_name: ""                    # Nova keypair name ("" = none)
    security_groups:
      - "default"

    # vSphere portgroup -> Neutron network, in vNIC order. Add
    # fixed_ip: "10.0.0.50" to an entry for a static address.
    networks:
      - network: "provider-net"     # Neutron network name or id

    # Disk mapping. `pure_volume` = the FlashArray volume from stage 1.
    # EXACTLY ONE disk must have `boot: true`.
    disks:
      - pure_volume: "lin-server01-disk-0"
        boot: true
        # Image metadata Nova reads when it creates an instance from this volume.
        # A UEFI guest does not boot with the BIOS default. A guest without virtio
        # drivers in its initramfs needs hw_disk_bus: sata (VM has an AHCI
        # controller) and hw_vif_model: vmxnet3; VMware PVSCSI does not boot with
        # UEFI firmware, and q35 has no IDE bus.
        image_properties:
          hw_firmware_type: "uefi"  # "bios" or "uefi" (vSphere: BIOS / EFI)
          hw_machine_type: "q35"    # with uefi; needed for Secure Boot
          # os_secure_boot: "required"  # source VM has Secure Boot enabled
          hw_disk_bus: "scsi"
          hw_scsi_model: "virtio-scsi"
          # hw_vif_model: "virtio"
          # os_type: "linux"
      - pure_volume: "lin-server01-disk-1"
        boot: false

    metadata:
      migrated_from: "vsphere"
      source_vm: "lin-server01"
