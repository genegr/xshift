---
# Per-VM import (loop_var: vm). Credentials from the environment (source
# admin-openrc.sh) or OS_CLOUD. validate_vm.yml has already checked this entry.

# 1. Manage each Pure volume into Cinder (idempotent: a Cinder volume that already
#    carries the Pure name is left alone). The Pure driver renames the array volume
#    to volume-<id>-cinder on manage; the mapping name lives on as the Cinder name.
- name: "{{ vm.name }} | Check whether each Pure volume is already managed"
  ansible.builtin.command: "openstack volume show {{ item.pure_volume | quote }} -f value -c id"
  register: vol_check
  changed_when: false
  failed_when: false
  loop: "{{ vm.disks }}"
  loop_control:
    label: "{{ item.pure_volume }}"

- name: "{{ vm.name }} | Manage existing Pure volumes into Cinder"
  ansible.builtin.command: >-
    openstack volume create
    --remote-source source-name={{ item.item.pure_volume | quote }}
    --host {{ cinder_pure_host | quote }}
    --type {{ cinder_pure_volume_type | quote }}
    {{ '--bootable' if (item.item.boot | default(false) | bool) else '' }}
    --property migrated_from=vsphere
    --property source_vm={{ vm.name | quote }}
    {{ item.item.pure_volume | quote }}
  when: item.rc != 0
  loop: "{{ vol_check.results }}"
  loop_control:
    label: "{{ item.item.pure_volume }}"

- name: "{{ vm.name }} | Wait for managed volumes to become available"
  ansible.builtin.command: "openstack volume show {{ item.pure_volume | quote }} -f value -c status"
  register: vol_status
  until: (vol_status.stdout | trim) in (['available'] + volume_error_states)
  retries: "{{ volume_available_retries }}"
  delay: "{{ volume_available_delay }}"
  changed_when: false
  loop: "{{ vm.disks }}"
  loop_control:
    label: "{{ item.pure_volume }}"

- name: "{{ vm.name }} | Fail when a volume ended in an error state"
  ansible.builtin.fail:
    msg: >-
      Volume {{ item.item.pure_volume }} is '{{ item.stdout | trim }}' after manage; see the
      cinder-volume log for {{ cinder_pure_host }}. 'openstack volume delete --remote
      {{ item.item.pure_volume }}' unmanages it again without touching the array.
  when: (item.stdout | trim) in volume_error_states
  loop: "{{ vol_status.results }}"
  loop_control:
    label: "{{ item.item.pure_volume }}"

# 2. Image properties: Nova takes firmware, disk bus and NIC model for a
#    boot-from-volume instance from the volume's image metadata.
- name: "{{ vm.name }} | Set image properties on the volumes"
  ansible.builtin.command: >-
    openstack volume set {{ item.pure_volume | quote }}
    {% for k, v in props.items() %}--image-property {{ (k ~ '=' ~ v) | quote }} {% endfor %}
  vars:
    props: >-
      {{ (default_boot_image_properties if (item.boot | default(false) | bool) else {})
         | combine(item.image_properties | default({})) }}
  when: props | length > 0
  loop: "{{ vm.disks }}"
  loop_control:
    label: "{{ item.pure_volume }}"
  changed_when: true

# 3. Resolve boot vs data volumes (validate_vm.yml guarantees exactly one boot disk)
- name: "{{ vm.name }} | Identify boot and data volumes"
  ansible.builtin.set_fact:
    boot_volume_name: "{{ boot_volumes | first }}"
    data_volume_names: "{{ vm.disks | map(attribute='pure_volume') | list | difference(boot_volumes) }}"
  vars:
    boot_volumes: "{{ vm.disks | selectattr('boot', 'defined') | selectattr('boot') | map(attribute='pure_volume') | list }}"

# 4. Optional flavor auto-create
- name: "{{ vm.name }} | Auto-create flavor"
  openstack.cloud.compute_flavor:
    name: "migrated-{{ vm.name }}"
    vcpus: "{{ vm.vcpus }}"
    ram: "{{ vm.ram_mb }}"
    disk: 0
    state: present
  when: vm.flavor_auto | default(false) | bool

- name: "{{ vm.name }} | Set effective flavor name"
  ansible.builtin.set_fact:
    effective_flavor: "{{ ('migrated-' + vm.name) if (vm.flavor_auto | default(false) | bool) else vm.flavor }}"

# 5. Build NIC list from the network mapping
- name: "{{ vm.name }} | Reset NIC list"
  ansible.builtin.set_fact:
    nics_list: []

- name: "{{ vm.name }} | Build NIC list"
  ansible.builtin.set_fact:
    nics_list: >-
      {{ nics_list + [ {'net-name': net.network}
         | combine({'v4-fixed-ip': net.fixed_ip} if net.fixed_ip is defined else {}) ] }}
  loop: "{{ vm.networks }}"
  loop_control:
    loop_var: net
    label: "{{ net.network }}"

# 6. Boot the instance from the boot volume
- name: "{{ vm.name }} | Boot instance from volume"
  openstack.cloud.server:
    name: "{{ vm.name }}"
    flavor: "{{ effective_flavor }}"
    boot_volume: "{{ boot_volume_name }}"
    terminate_volume: false
    availability_zone: "{{ vm.availability_zone | default(omit) }}"
    key_name: "{{ vm.key_name if (vm.key_name | default('') | length > 0) else omit }}"
    security_groups: "{{ vm.security_groups | default(omit) }}"
    nics: "{{ nics_list }}"
    meta: "{{ vm.metadata | default(omit) }}"
    auto_ip: false
    state: present
    timeout: "{{ server_boot_timeout }}"
  register: srv

# 7. Attach data volumes
- name: "{{ vm.name }} | Attach data volumes"
  openstack.cloud.server_volume:
    server: "{{ vm.name }}"
    volume: "{{ item }}"
    state: present
  loop: "{{ data_volume_names }}"
  loop_control:
    label: "{{ item }}"

- name: "{{ vm.name }} | Result"
  ansible.builtin.debug:
    msg: >-
      Migrated '{{ vm.name }}' -> instance {{ srv.server.id | default('?') }},
      status={{ srv.server.status | default('?') }},
      addresses={{ srv.server.addresses | default({}) }}
