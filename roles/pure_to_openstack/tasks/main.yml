---
# Stage 2: import the Pure volumes into Cinder (manage-existing) and recreate
# each VM as a Nova instance (boot-from-volume). Requires vm_migrations
# (supplied by the mapping file) and OpenStack credentials in the environment.

- name: Validate mapping is present
  ansible.builtin.assert:
    that:
      - vm_migrations is defined
      - vm_migrations | length > 0
    fail_msg: "No 'vm_migrations' found. Provide a mapping file (see mapping.example.yaml)."

- name: "Status Check: Dry Run Mode"
  ansible.builtin.debug:
    msg: "DRY RUN MODE IS ENABLED. The mapping is validated against OpenStack; nothing is changed."
  when: dry_run | bool

# Every entry is checked against OpenStack (flavor, networks, volumes managed or
# manageable) before anything is imported, on dry runs and real runs alike.
- name: Validate each VM mapping against OpenStack
  ansible.builtin.include_tasks: validate_vm.yml
  loop: "{{ vm_migrations }}"
  loop_control:
    loop_var: vm
    label: "{{ vm.name | default('?') }}"

- name: Import and boot each VM
  ansible.builtin.include_tasks: import_vm.yml
  loop: "{{ vm_migrations }}"
  loop_control:
    loop_var: vm
    label: "{{ vm.name }}"
  when: not (dry_run | bool)
