---
# Render the stage 2 mapping entry from vCenter facts and write it (needs
# vm_general_info, vm_config_info, vm_flat_disks, vm_name_slug, target_vm_name).

# vSphere reports 'bios' or 'efi'; Nova wants hw_firmware_type bios|uefi.
# A UEFI guest booted with the BIOS default never finds its loader, which is
# the most common reason a migrated instance does not come up.
# One expression for the whole entry: a "{{ x | int }}" leaf inside a YAML dict
# comes back as a string, while numbers inside one templated dict stay numbers.
- name: Build the mapping entry
  ansible.builtin.set_fact:
    vm_mapping_firmware: "{{ firmware }}"
    vm_mapping_entry: >-
      {{ {'name': target_vm_name,
          'flavor_auto': true,
          'vcpus': vm_config_info.instance.config.hardware.numCPU | int,
          'ram_mb': vm_config_info.instance.config.hardware.memoryMB | int,
          'availability_zone': 'nova',
          'key_name': '',
          'security_groups': ['default'],
          'networks': vm_mapping_networks,
          'disks': vm_mapping_disks,
          'metadata': {'migrated_from': 'vsphere',
                       'source_vm': target_vm_name,
                       'source_guest_id': vm_config_info.instance.config.guestId | default('')}} }}
  vars:
    firmware: "{{ 'uefi' if (vm_config_info.instance.config.firmware | default('bios')) == 'efi' else 'bios' }}"
    secure_boot: >-
      {{ firmware == 'uefi'
         and (vm_config_info.instance.config.bootOptions.efiSecureBootEnabled | default(false) | bool) }}
    # hw_ethN entries of vmware_guest_info, in NIC order; the network is copied
    # verbatim and has to be mapped to a Neutron network by hand. vmware_guest_info
    # has no portgroup name field: a standard-switch NIC carries the network name in
    # 'summary', a distributed-switch NIC the portgroup key (summary is the switch).
    vm_portgroups: >-
      {%- set out = [] -%}
      {%- for nic in vm_general_info.instance | dict2items
                     | selectattr('key', 'match', '^hw_eth[0-9]+$') | sort(attribute='key') -%}
      {%- set v = nic.value -%}
      {%- set _ = out.append(v.portgroup | default(v.portgroup_key, true)
                             | default(v.summary, true) | default(nic.key, true)) -%}
      {%- endfor -%}
      {{ out }}
    vm_mapping_networks: >-
      {%- set out = [] -%}
      {%- for pg in vm_portgroups -%}
      {%- set _ = out.append({'network': pg}) -%}
      {%- endfor -%}
      {{ out }}
    vm_mapping_disks: >-
      {%- set out = [] -%}
      {%- for d in vm_flat_disks -%}
      {%- set is_boot = (d.key | int) == (boot_disk_index | int) -%}
      {%- set entry = {'pure_volume': vm_name_slug ~ '-disk-' ~ d.key,
                       'boot': is_boot,
                       'source_vmdk': d.value.backing_filename,
                       'size_gb': ((d.value.capacity_in_kb | int) / 1048576) | round(0, 'ceil') | int} -%}
      {%- if is_boot -%}
      {%- set props = {'hw_firmware_type': firmware,
                       'hw_disk_bus': 'scsi',
                       'hw_scsi_model': 'virtio-scsi'} -%}
      {%- if firmware == 'uefi' -%}
      {#- Secure Boot needs q35 with SMM; q35 is also the usual UEFI machine type -#}
      {%- set _ = props.update({'hw_machine_type': 'q35'}) -%}
      {%- endif -%}
      {%- if secure_boot | bool -%}
      {%- set _ = props.update({'os_secure_boot': 'required'}) -%}
      {%- endif -%}
      {%- set _ = entry.update({'image_properties': props}) -%}
      {%- endif -%}
      {%- set _ = out.append(entry) -%}
      {%- endfor -%}
      {{ out }}

- name: Warn when no cloned disk is the boot disk
  ansible.builtin.debug:
    msg: >-
      WARNING: no cloned disk has vCenter key {{ boot_disk_index }}, so the mapping has no
      'boot: true' disk. Set boot_disk_index or mark the boot disk by hand.
  when: vm_mapping_entry.disks | selectattr('boot') | list | length == 0

- name: Ensure the mapping output directory exists
  ansible.builtin.file:
    path: "{{ mapping_output_dir }}"
    state: directory
    mode: "0755"
  delegate_to: localhost

- name: Write the mapping fragment
  ansible.builtin.copy:
    dest: "{{ mapping_output_dir }}/mapping-{{ vm_name_slug }}.yaml"
    mode: "0644"
    content: |
      ---
      # Generated by stage 1 (roles/vsphere_to_pure) for '{{ target_vm_name }}'.
      # Review before use:
      #   - networks: vSphere portgroup names copied as-is; replace with Neutron networks
      #   - flavor_auto/vcpus/ram_mb: or set 'flavor' to an existing flavor instead
      #   - key_name, security_groups, availability_zone
      #   - image_properties on the boot disk (firmware and Secure Boot read from vCenter;
      #     bus defaults to virtio-scsi, which needs virtio drivers in the guest's
      #     initramfs. Without them use hw_disk_bus: sata (if the VM has an AHCI
      #     controller) and hw_vif_model: vmxnet3; VMware PVSCSI does not boot with OVMF)
      # source_vmdk and size_gb are informational.
      # Use with:
      #   ansible-playbook migrate_to_openstack.yaml -e mapping_file={{ mapping_output_dir }}/mapping-{{ vm_name_slug }}.yaml
      {{ {'vm_migrations': [vm_mapping_entry]} | to_nice_yaml(indent=2, width=120) }}
  delegate_to: localhost

- name: Report the mapping fragment
  ansible.builtin.debug:
    msg: >-
      Stage 2 mapping written to {{ mapping_output_dir }}/mapping-{{ vm_name_slug }}.yaml
      (firmware {{ vm_mapping_firmware }}, {{ vm_mapping_entry.vcpus }} vCPU,
      {{ vm_mapping_entry.ram_mb }} MB, networks
      {{ vm_mapping_entry.networks | map(attribute='network') | join(', ') | default('none', true) }}).
