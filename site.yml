---
# Full pipeline: stage 1 (vSphere -> Pure) then stage 2 (Pure -> OpenStack).
# Requires vCenter/ESXi/Pure access AND OpenStack credentials in the environment.
# Stage 2 reads mapping.yaml (or -e mapping_file=...). Stage 1 writes a reviewed
# starting point to generated/mapping-<vm>.yaml, so run the stages separately
# the first time and review the mapping in between.
- name: Stage 1 - vSphere to FlashArray
  ansible.builtin.import_playbook: migrate_vm.yaml

- name: Stage 2 - FlashArray to OpenStack
  ansible.builtin.import_playbook: migrate_to_openstack.yaml
